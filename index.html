<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KIU Campus Navigator — Kampala International University, Kansanga</title>
<meta name="description" content="Interactive campus map, turn-by-turn walking directions and visitor essentials for Kampala International University (KIU) Main Campus, Kansanga, Kampala, Uganda.">
<meta name="theme-color" content="#006837">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23006837'/%3E%3Cpath d='M16 7 6 12l10 5 10-5-10-5z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M11 14.5V20c0 1.4 2.2 2.6 5 2.6s5-1.2 5-2.6v-5.5' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream: '#F8F9FA',
          ink: '#1E293B',
          brand: {
            DEFAULT: '#006837', 50: '#E6F4EA', 100: '#CFEBD9', 200: '#A7D8BA',
            300: '#6FBF8D', 400: '#2EA265', 500: '#10B981', 600: '#0E9A6E',
            700: '#006837', 800: '#00522B', 900: '#003D21'
          },
          sage: '#E6F4EA',
          sand: '#FCFAF5',
          slateink: '#1E293B'
        },
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif']
        },
        borderRadius: { '2xl': '1rem', '3xl': '1.5rem', '4xl': '2rem' },
        boxShadow: {
          soft: '0 10px 25px -5px rgba(0,0,0,0.05)',
          lift: '0 18px 40px -18px rgba(15,23,42,0.30)',
          sheet: '0 -12px 40px -12px rgba(15,23,42,0.22)',
          pin: '0 6px 14px -4px rgba(15,23,42,0.35)'
        },
        transitionTimingFunction: { calm: 'cubic-bezier(0.22, 1, 0.36, 1)' }
      }
    }
  };
</script>
<link rel="stylesheet" href="assets/css/app.css">
</head>

<body class="min-h-screen bg-cream font-sans text-ink antialiased selection:bg-brand-100 selection:text-brand-900">

<!-- ====================== ICON SPRITE ====================== -->

<!-- ====================== APP SHELL ====================== -->
<div class="relative min-h-screen lg:flex">

  <!-- ---------- DESKTOP DRAWER ---------- -->
  <aside id="drawer"
         class="hidden lg:flex lg:w-[26.5rem] xl:w-[28rem] shrink-0 flex-col h-screen bg-white/92 backdrop-blur-xl border-r border-slate-200/70 z-30">
    <div class="px-5 pt-5 pb-4 flex items-start gap-3">
      <div class="h-11 w-11 shrink-0 rounded-2xl bg-brand-700 grid place-items-center shadow-soft">
        <svg class="h-6 w-6 text-white"><use href="#i-compass"/></svg>
      </div>
      <div class="min-w-0 flex-1">
        <h1 class="text-[15px] font-extrabold tracking-tight text-ink leading-tight">KIU Campus Navigator</h1>
        <p class="text-[12.5px] text-slate-500 leading-snug mt-0.5">
          <span class="font-semibold text-brand-700">Main Campus</span> · Kansanga, Kampala
        </p>
      </div>
      <button type="button" data-action="open-about"
              class="h-11 w-11 shrink-0 grid place-items-center rounded-2xl text-slate-400 hover:text-brand-700 hover:bg-brand-50 transition-colors duration-200 ease-calm"
              aria-label="About this navigator">
        <svg class="h-5 w-5"><use href="#i-info"/></svg>
      </button>
    </div>

    <div class="px-5 pb-4 space-y-3 border-b border-slate-100 bg-white/60">
      <div id="slot-search-desktop"></div>
      <div id="slot-segments-desktop"></div>
      <div id="slot-chips-desktop"></div>
    </div>

    <div class="flex-1 overflow-y-auto overscroll-contain scroll-slim px-5 py-5 space-y-7">
      <section id="slot-route-desktop" aria-label="Directions"></section>
      <section id="slot-list-desktop" aria-label="Campus locations"></section>
      <section id="slot-essentials-desktop" aria-label="Campus essentials"></section>
      <footer class="pt-2 pb-2 text-[11.5px] leading-relaxed text-slate-400">
        <p class="font-semibold text-slate-500">Kampala International University · Kansanga Main Campus</p>
        <p class="mt-1">Map and distances are an illustrative campus plan for navigation and wayfinding. Confirm opening hours and contacts with the University Registrar before you travel.</p>
      </footer>
    </div>
  </aside>

  <!-- ---------- MAP CANVAS ---------- -->
  <main class="relative flex-1 h-[100dvh] lg:h-screen lg:ml-0">
    <div id="map" class="absolute inset-0 z-0" role="application" aria-label="Interactive map of KIU Kansanga main campus"></div>

    <!-- mobile floating top bar -->
    <div class="lg:hidden absolute inset-x-0 top-0 z-[500] px-3 pt-[max(0.75rem,env(safe-area-inset-top))] pointer-events-none">
      <div id="slot-search-mobile" class="pointer-events-auto"></div>
      <div id="slot-chips-mobile" class="pointer-events-auto mt-2"></div>
    </div>

    <!-- map controls -->
    <div class="absolute right-3 z-[600] flex flex-col gap-2 items-end"
         style="bottom:calc(var(--sheet-offset, 0px) + 16px)">
      <div class="hidden lg:flex flex-col overflow-hidden rounded-2xl border border-slate-200/80 bg-white/95 shadow-lift backdrop-blur">
        <button type="button" data-action="zoom-in" class="h-12 w-12 grid place-items-center text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-colors duration-200" aria-label="Zoom in">
          <svg class="h-5 w-5"><use href="#i-plus"/></svg>
        </button>
        <span class="h-px w-7 mx-auto bg-slate-200"></span>
        <button type="button" data-action="zoom-out" class="h-12 w-12 grid place-items-center text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-colors duration-200" aria-label="Zoom out">
          <svg class="h-5 w-5"><use href="#i-minus"/></svg>
        </button>
        <span class="h-px w-7 mx-auto bg-slate-200"></span>
        <button type="button" data-action="locate" class="h-12 w-12 grid place-items-center text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition-colors duration-200" aria-label="Find my location">
          <svg class="h-5 w-5"><use href="#i-locate"/></svg>
        </button>
      </div>

      <button type="button" data-action="locate"
              class="lg:hidden h-12 w-12 grid place-items-center rounded-2xl border border-slate-200/80 bg-white/95 shadow-lift text-slate-600 active:scale-95 transition-transform duration-200"
              aria-label="Find my location">
        <svg class="h-5 w-5"><use href="#i-locate"/></svg>
      </button>
    </div>

    <!-- basemap switcher -->
    <div class="absolute left-3 top-3 z-[600] hidden lg:flex flex-col gap-2 items-start">
      <div class="flex items-center gap-1 rounded-2xl border border-slate-200/80 bg-white/95 p-1 shadow-lift backdrop-blur" role="group" aria-label="Map background">
        <button type="button" data-basemap="plan" class="px-3.5 h-11 rounded-xl text-[13px] font-semibold transition-all duration-300 ease-calm bg-brand-700 text-white">Plan</button>
        <button type="button" data-basemap="street" class="px-3.5 h-11 rounded-xl text-[13px] font-semibold transition-all duration-300 ease-calm text-slate-600 hover:bg-slate-100">Street</button>
        <button type="button" data-basemap="satellite" class="px-3.5 h-11 rounded-xl text-[13px] font-semibold transition-all duration-300 ease-calm text-slate-600 hover:bg-slate-100">Satellite</button>
      </div>
      <button type="button" data-action="recenter"
              class="h-11 px-4 flex items-center gap-2 rounded-2xl border border-slate-200/80 bg-white/95 shadow-lift text-[13px] font-semibold text-slate-600 hover:text-brand-700 hover:bg-brand-50 transition-colors duration-200">
        <svg class="h-4 w-4"><use href="#i-compass"/></svg> Recentre
      </button>
    </div>

    <!-- legend -->
    <div id="legend" class="absolute z-[600] left-3 bottom-4 hidden lg:block"></div>
  </main>
</div>

<!-- ---------- MOBILE BOTTOM SHEET ---------- -->
<section id="sheet"
         class="lg:hidden fixed inset-x-0 bottom-0 z-[900] flex flex-col bg-white rounded-t-4xl shadow-sheet border-t border-slate-200/70"
         style="height:88dvh; transform:translateY(72%);">
  <div id="sheet-grip" class="pt-3.5 pb-3 flex justify-center cursor-grab touch-none select-none" role="button" tabindex="0" aria-label="Expand or collapse the panel">
    <span class="h-1.5 w-11 rounded-full bg-slate-300"></span>
  </div>
  <div id="sheet-tabs" class="px-3 pb-2 flex gap-1.5" role="tablist" aria-label="Navigator sections"></div>
  <div id="sheet-panes" class="relative flex-1 min-h-0 overflow-hidden">
    <div data-pane="explore" class="absolute inset-0 overflow-y-auto overscroll-contain scroll-slim px-4 pb-8 pt-1" role="tabpanel">
      <div id="slot-segments-mobile" class="mb-3"></div>
      <div id="slot-list-mobile"></div>
    </div>
    <div data-pane="route" class="absolute inset-0 overflow-y-auto overscroll-contain scroll-slim px-4 pb-8 pt-1 hidden" role="tabpanel"></div>
    <div data-pane="essentials" class="absolute inset-0 overflow-y-auto overscroll-contain scroll-slim px-4 pb-8 pt-1 hidden" role="tabpanel"></div>
  </div>
</section>

<!-- floating action button (mobile) -->
<button type="button" data-action="open-route"
        class="lg:hidden fixed right-4 z-[880] h-14 w-14 grid place-items-center rounded-2xl bg-brand-700 text-white shadow-lift active:scale-95 transition-transform duration-200"
        style="bottom:calc(var(--sheet-offset, 150px) + 16px)"
        aria-label="Open directions">
  <svg class="h-6 w-6"><use href="#i-navigation"/></svg>
</button>

<!-- ---------- WELCOME / ABOUT MODAL ---------- -->
<div id="modal" class="fixed inset-0 z-[1000]" aria-hidden="true">
  <div class="kiu-modal-backdrop absolute inset-0 bg-slate-900/40 backdrop-blur-sm" data-action="close-modal"></div>
  <div class="absolute inset-0 grid place-items-center p-5 pointer-events-none">
    <div id="modal-card"
         class="pointer-events-auto w-full max-w-md bg-white rounded-3xl shadow-lift p-6 sm:p-7">
      <div id="modal-body"></div>
    </div>
  </div>
</div>

<!-- live region for announcements -->
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<script src="assets/js/data.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/router.js"></script>
<script src="assets/js/map.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
